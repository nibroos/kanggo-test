server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression (policy §7).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    server_tokens off;

    include /etc/nginx/security-headers.inc;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        include    /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # index.html itself must never be cached, or a deploy would not reach clients.
    location = /index.html {
        include    /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # History-mode routing: unknown paths are handed to the SPA, not 404'd.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
