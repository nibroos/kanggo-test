# ---------------------------------------------------------------------------
# Full stack: MySQL + backend API + frontend (spec §18.5).
#
#   docker compose up -d --build
#   docker compose exec backend npm run migrate
#   docker compose exec backend npm run seed
#
# Frontend  http://localhost:4089
# API       http://localhost:4088/api
# API docs  http://localhost:4088/api/docs
#
# Host ports are deliberately non-default (3307/4088/4089) so this stack can run
# next to other local projects without clashing.
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.4
    container_name: task-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-task_management}
      MYSQL_USER: ${DB_USER:-task_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-task_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs only on first initialisation: creates the schema used by `npm test`.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-root_password}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: task-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4088
      LOG_LEVEL: info
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-task_user}
      DB_PASSWORD: ${DB_PASSWORD:-task_password}
      DB_NAME: ${DB_NAME:-task_management}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4089,http://localhost:5173}
    ports:
      - '${BACKEND_PORT:-4088}:4088'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4088/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: Vite inlines env vars into the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4088/api}
    container_name: task-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-4089}:80'

volumes:
  mysql_data:
